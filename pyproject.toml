[project]
name = "cot-reduction"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.0.1",
    "httpx>=0.28.1",
    "inspect-ai>=0.3.268",
    "inspect-cyber>=0.1.0",
    "inspect-evals==0.21.0",
    "openai>=3.19.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["scripts", "eval"]
testpaths = ["tests"]
